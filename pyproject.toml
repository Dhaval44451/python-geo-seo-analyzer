[project]
name = "seo-analyzer-python"
version = "0.1.0"
description = "Python-based SEO and GEO analysis tool inspired by the Next.js SEO Analyzer project."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SEO Analyzer Team" }
]
license = "MIT"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Linguistic"
]

dependencies = [
    "fastapi>=0.111.2",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.4",
    "python-dotenv>=1.0.0",
    "pydantic>=2.8.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"